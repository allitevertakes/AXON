[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "axon-backend"
version = "0.1.0"
description = "Backend foundation for the AXON Human Capital Intelligence Platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "pdfplumber>=0.11,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.40,<2.0",
]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]